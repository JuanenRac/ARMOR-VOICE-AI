[build-system]
requires=["setuptools>=84.2.1"]
build-backend="setuptools.build_meta"
[project]
name="armor-voice-ai"
version = "0.3.4"
requires-python=">=3.11"
[project.scripts]
armor-voice-gateway="armor_voice_ai.gateway:main"
[tool.setuptools.packages.find]
where=["src"]

[tool.mypy]
python_version = "3.11"
files = ["src"]
