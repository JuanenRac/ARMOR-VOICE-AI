<text x="36" y="46" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="24" font-weight="700" fill="#FFFFFF" text-anchor="start">A spoken turn that arms the system</text>
<text x="36" y="70" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#8B949E" text-anchor="start">The panel is asked twice, and disarming is refused: it needs a PIN typed on the screen.</text>
