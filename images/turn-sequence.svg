<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 930" width="100%" role="img" aria-labelledby="t d">
<title id="t">A spoken turn that arms the system</title>
<desc id="d">The wall panel sends audio to ARMOR-VOICE-AI. The service asks the speech engine for the words, asks ARMOR-SERVER, which answers that a confirmation is needed and gives a token. The service says "Please confirm" and the panel is asked a second time; with the answer yes and the token the server accepts. Disarming is refused: it needs a PIN typed on the screen.</desc>
